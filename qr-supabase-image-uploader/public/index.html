<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ID Login QR Uploader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>ID Login QR Uploader</h1>

      <section class="panel">
        <h2>Login</h2>
        <div id="authStatus" class="status"></div>

        <div class="authGrid">
          <input id="username" class="input" placeholder="username/id" autocomplete="username" />
          <input id="password" class="input" type="password" placeholder="password" autocomplete="current-password" />
          <button id="signupBtn" class="button">Sign up</button>
          <button id="loginBtn" class="button">Log in</button>
          <button id="logoutBtn" class="button secondary">Log out</button>
        </div>

        <div class="linksRow">
          <a id="galleryLink" class="link" href="/gallery.html">My uploads</a>
        </div>
      </section>

      <section id="appSection" class="panel" style="margin-top:16px;">
        <h2>Upload session</h2>
        <button id="makeQrBtn" class="button">Generate QR</button>
        <div id="status" class="status"></div>

        <div class="qrRow">
          <div>
            <div id="qr" class="qrBox"></div>
            <a id="uploadLink" class="link" href="#" target="_blank" rel="noreferrer"></a>
          </div>
          <div class="preview">
            <div class="previewTitle">Latest uploaded image (this session)</div>
            <img id="resultImg" alt="Uploaded will appear here" />
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/main.js"></script>
  </body>
</html>
